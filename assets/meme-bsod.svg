<svg xmlns="http://www.w3.org/2000/svg" width="900" height="205" viewBox="0 0 900 205"><rect x="1" y="1" width="898" height="203" rx="12" fill="#1648a5" stroke="#a78bfa" stroke-width="2"/><g font-family="monospace"><text x="25" y="50" fill="#fff" font-size="36">:(</text><text x="25" y="85" fill="#fff" font-size="20">Seu desenvolvedor encontrou um problema e precisa de férias.</text><g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="16s" repeatCount="indefinite"/><text x="25" y="130" fill="#fde047" font-size="18">ERRO 404: vontade de trabalhar não encontrada.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="16s" repeatCount="indefinite"/><text x="25" y="130" fill="#fde047" font-size="18">ERRO 503: café indisponível.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="16s" repeatCount="indefinite"/><text x="25" y="130" fill="#fde047" font-size="18">ERRO 418: eu sou uma chaleira.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="16s" repeatCount="indefinite"/><text x="25" y="130" fill="#fde047" font-size="18">Reiniciando o funcionário...</text></g><text x="25" y="175" fill="#bfdbfe" font-size="15">Código de parada: SEGUNDA_FEIRA_EXCEPTION</text></g></svg>